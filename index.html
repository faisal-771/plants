<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بيت النباتات الأركيدي 🌿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1c1917;          /* تربة عميقة */
      --card-bg: #292524;     /* بني طيني خردلي */
      --inner-bg: #181514;    /* عمق الأحواض */
      --border: #78350f;      /* لحاء الخشب */
      --accent: #22c55e;      /* أخضر نمو منعش */
      --accent-glow: #15803d;
      --text: #fef08a;        /* عاجي دافئ مائل للصفرة */
      --muted: #a8a29e;
      --shadow: #451a03;
    }

    /* حالات الصحة */
    .good { --status: #4ade80; --status-sub: #166534; }
    .warn { --status: #facc15; --status-sub: #854d0e; }
    .danger { --status: #f87171; --status-sub: #991b1b; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(#44403c 1px, transparent 1px),
        radial-gradient(#292524 1px, var(--bg) 1px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    /* هيكل الصندوق الأركيدي الخشبي */
    .arcade-box {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border: 4px solid var(--border);
      border-radius: 12px;
      box-shadow: 
        0 0 0 4px #0c0a09,
        0 8px 0 4px var(--shadow),
        0 14px 20px rgba(0,0,0,0.7);
      padding: 1.25rem;
      position: relative;
    }

    /* تفاصيل بكسلية في الزوايا */
    .arcade-box::before {
      content: "LEVEL 1";
      position: absolute;
      top: -14px;
      left: 16px;
      background: var(--border);
      color: #fed7aa;
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
      padding: 0 8px;
      border: 2px solid #0c0a09;
      letter-spacing: 2px;
    }

    .title-area {
      text-align: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px dashed #44403c;
    }

    .title-area h1 {
      font-size: 1.6rem;
      font-weight: 900;
      color: #86efac;
      text-shadow: 2px 2px 0px #14532d;
    }

    .pixel-id {
      font-family: 'VT323', monospace;
      color: #fdba74;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    /* لوحة قياس الري والحالة */
    .dashboard {
      background: var(--inner-bg);
      border: 3px solid #44403c;
      border-radius: 8px;
      padding: 0.9rem;
      margin-bottom: 1rem;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
    }

    .meter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }

    .meter-label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 700;
    }

    .days-badge {
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      color: var(--status);
      text-shadow: 0 0 8px var(--status-sub);
    }

    .alert-banner {
      background: rgba(0, 0, 0, 0.4);
      border-right: 4px solid var(--status);
      padding: 0.4rem 0.6rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--status);
      border-radius: 4px;
    }

    /* قائمة تفاصيل النبتة */
    .stats-grid {
      display: grid;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .stat-row {
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid #3f3f46;
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .stat-name {
      color: #d6d3d1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-value {
      font-weight: 700;
      color: #fed7aa;
    }

    /* أزرار الأركيد التفاعلية */
    .btn-water {
      width: 100%;
      background: #15803d;
      border: 2px solid #22c55e;
      border-bottom: 6px solid #14532d;
      color: #f0fdf4;
      font-size: 1.15rem;
      font-weight: 900;
      padding: 0.75rem;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: all 0.08s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-water:hover {
      background: #16a34a;
    }

    .btn-water:active {
      border-bottom-width: 2px;
      transform: translateY(4px);
    }

    .btn-edit-toggle {
      width: 100%;
      background: none;
      border: none;
      color: #a8a29e;
      font-size: 0.8rem;
      padding: 0.6rem;
      cursor: pointer;
      text-decoration: underline;
      text-align: center;
      margin-top: 0.2rem;
    }

    /* نموذج تعديل البيانات */
    .edit-drawer {
      display: none;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 2px dashed #44403c;
      gap: 0.5rem;
      flex-direction: column;
    }

    .edit-drawer.open {
      display: flex;
    }

    .edit-drawer input {
      background: #1c1917;
      border: 2px solid #57534e;
      color: #fef08a;
      padding: 0.55rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .edit-drawer input:focus {
      border-color: #22c55e;
    }

    .btn-save {
      background: #78350f;
      border: 2px solid #b45309;
      border-bottom: 4px solid #451a03;
      color: #fef3c7;
      font-weight: 700;
      padding: 0.6rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-save:active {
      border-bottom-width: 2px;
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <div class="arcade-box good" id="main-box">
    <div class="title-area">
      <h1 id="plant-name">نبتتي</h1>
      <span class="pixel-id" id="plant-id">ID: 000</span>
    </div>

    <!-- شاشة العداد الأركيدية -->
    <div class="dashboard">
      <div class="meter-header">
        <span class="meter-label">💧 حالة الري الأخيرة</span>
        <span class="days-badge" id="water-days">READY</span>
      </div>
      <div class="alert-banner" id="status-msg">اضغط للري وسجل الحالة</div>
    </div>

    <!-- بطاقات البيانات الزراعية -->
    <div class="stats-grid">
      <div class="stat-row">
        <span class="stat-name">🪴 نوع التربة</span>
        <span class="stat-value" id="val-soil">-</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">🗓️ تاريخ الغرس/الشراء</span>
        <span class="stat-value" id="val-date">-</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">🪙 قيمة النبتة</span>
        <span class="stat-value" id="val-price">-</span>
      </div>
    </div>

    <!-- زر السقاية الأركيدي البارز -->
    <button class="btn-water" onclick="waterPlant()">
      <span>سقيتها اليوم</span> 💧
    </button>

    <button class="btn-edit-toggle" onclick="toggleEdit()">[ تعديل بيانات النبتة ]</button>

    <!-- واجهة الإدخال المخفية -->
    <div class="edit-drawer" id="drawer">
      <input id="in-name" placeholder="اسم النبتة (مثل: مونستيرا)">
      <input id="in-soil" placeholder="نوع التربة (مثل: بيتموس + بيرلايت)">
      <input id="in-date" type="date">
      <input id="in-price" placeholder="السعر (مثال: 45 ر.س)">
      <button class="btn-save" onclick="saveData()">حفظ التعديلات ★</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const plantId = urlParams.get('id') || 'PLANT_01';
    const storeKey = `green_arcade_${plantId}`;

    let data = JSON.parse(localStorage.getItem(storeKey)) || {
      name: 'نبتة جديدة',
      soil: 'تربة زراعية مخلوطة',
      date: '',
      price: '',
      lastWater: null
    };

    function render() {
      const box = document.getElementById('main-box');
      document.getElementById('plant-id').innerText = `TAG // ${plantId.toUpperCase()}`;
      document.getElementById('plant-name').innerText = data.name;
      document.getElementById('val-soil').innerText = data.soil || '-';
      document.getElementById('val-date').innerText = data.date || '-';
      document.getElementById('val-price').innerText = data.price || '-';

      box.classList.remove('good', 'warn', 'danger');

      if (!data.lastWater) {
        box.classList.add('danger');
        document.getElementById('water-days').innerText = 'NO DATA';
        document.getElementById('status-msg').innerText = '■ سجل أول ريّة لبدء الحساب!';
        return;
      }

      const diff = Math.floor((new Date().setHours(0,0,0,0) - new Date(data.lastWater).setHours(0,0,0,0)) / 86400000);
      const text = diff === 0 ? 'اليوم' : diff === 1 ? 'أمس' : `منذ ${diff} أيام`;

      document.getElementById('water-days').innerText = text;

      if (diff <= 3) {
        box.classList.add('good');
        document.getElementById('status-msg').innerText = '● التربة رطبة ومنعشة جداً';
      } else if (diff <= 6) {
        box.classList.add('warn');
        document.getElementById('status-msg').innerText = '▲ افحص ملمس التربة بإصبعك';
      } else {
        box.classList.add('danger');
        document.getElementById('status-msg').innerText = '■ تحذير: التربة جافة بحاجة لماء!';
      }
    }

    function waterPlant() {
      data.lastWater = new Date().toISOString();
      persist();
    }

    function toggleEdit() {
      const d = document.getElementById('drawer');
      d.classList.toggle('open');
      if (d.classList.contains('open')) {
        document.getElementById('in-name').value = data.name;
        document.getElementById('in-soil').value = data.soil;
        document.getElementById('in-date').value = data.date;
        document.getElementById('in-price').value = data.price;
      }
    }

    function saveData() {
      data.name = document.getElementById('in-name').value || data.name;
      data.soil = document.getElementById('in-soil').value || data.soil;
      data.date = document.getElementById('in-date').value || data.date;
      data.price = document.getElementById('in-price').value || data.price;
      toggleEdit();
      persist();
    }

    function persist() {
      localStorage.setItem(storeKey, JSON.stringify(data));
      render();
    }

    render();
  </script>
</body>
</html>
